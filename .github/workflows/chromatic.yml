name: "Chromatic"

on:
  push:
  pull_request_target:
    branches: [main]

jobs:
  vitest:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.62.1-noble
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 24.13.0
      - name: Install dependencies
        run: npm ci
      - name: Run Vitest tests
        #run: npx vitest run --project chromatic
        run: npm run chromatic:tests
        env:
          HOME: /root
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: test-results-action
          path: .vitest/chromatic
          retention-days: 1
  chromatic:
    name: Run Chromatic
    needs: vitest
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          # BUG (by design, for now): pull_request event checks out synthetic merge commit
          # (refs/pull/N/merge), not real head SHA. Merge commit's base parent drifts if
          # base branch moves after PR opened -> TurboSnap diffs against wrong baseline ->
          # false skips/inconsistent snapshots. Fix: checkout actual head commit.
          # ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: 24.13.0
      - name:
          Install dependencies
          # ⚠️ See your package manager's documentation for the correct command to install dependencies in a CI environment.
        run: npm ci
      - name: Download Vitest test results
        uses: actions/download-artifact@v8
        with:
          name: test-results-action
          path: .vitest/chromatic
      # - name: Display Vitest test results Action
      #   run: |
      #     echo "Vitest Test Results Action:"
      #     ls -la
      #     echo "Contents of the root directory:"
      #     ls -la .vitest*
      #     echo "Contents of .vitest/ directory:"
      #     cd .vitest
      #     tree
      - name: Run Chromatic
        uses: chromaui/action@latest
        with:
          # ⚠️ Enable Vitest
          vitest: true
          onlyChanged: true
          exitZeroOnChanges: true
          projectToken: chpt_eb85cff031158fa
          externals: |
            **/*.sass
            **/*.css
            public/**
